<!DOCTYPE html>
<html>
<head>
<title>Nova Arcadia | Reserva</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
.w3-sidebar a {font-family: "Roboto", sans-serif}
body,h1,h2,h3,h4,h5,h6,.w3-wide {font-family: "Montserrat", sans-serif;}
.product-item {
    border: 1px solid #ddd;
    padding: 15px;
    margin: 10px 0;
    border-radius: 5px;
    background: #f9f9f9;
}
.product-header {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
}
.product-name {
    font-weight: bold;
    font-size: 18px;
    margin-right: 15px;
}
.product-price {
    color: #2196F3;
    font-size: 16px;
    font-weight: bold;
}
.size-selection {
    margin: 10px 0;
}
.size-selection label {
    margin-right: 15px;
    cursor: pointer;
}
.quantity-control {
    display: flex;
    align-items: center;
    gap: 10px;
}
.quantity-control input {
    width: 60px;
    text-align: center;
    padding: 5px;
}
.form-section {
    margin: 20px 0;
    padding: 15px;
    background: #fff;
    border-radius: 5px;
}
.form-section h3 {
    margin-top: 0;
    border-bottom: 2px solid #000;
    padding-bottom: 10px;
}
.form-group {
    margin: 15px 0;
}
.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}
.form-group input, .form-group textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 3px;
    box-sizing: border-box;
}
.form-group textarea {
    resize: vertical;
    min-height: 80px;
}
.total-section {
    background: #000;
    color: #fff;
    padding: 15px;
    margin: 20px 0;
    border-radius: 5px;
    text-align: right;
}
.total-section h3 {
    margin: 0;
    font-size: 24px;
}
.submit-btn {
    background: #2196F3;
    color: white;
    padding: 15px 30px;
    border: none;
    border-radius: 5px;
    font-size: 18px;
    cursor: pointer;
    width: 100%;
    font-weight: bold;
}
.submit-btn:hover {
    background: #0b7dda;
}
</style>
</head>
<body class="w3-content" style="max-width:1200px">
    <nav class="w3-sidebar w3-bar-block w3-white w3-collapse w3-top" style="z-index:3;width:250px" id="mySidebar">
    <div class="w3-container w3-display-container w3-padding-16">
    <i onclick="w3_close()" class="fa fa-remove w3-hide-large w3-button w3-display-topright"></i>
    <h3 class="w3-wide"><img src="images/Nova Arcadia-logo-transparent.png" width="75%"></h3>
    </div>
    <a href="index.html" class="w3-bar-item w3-button w3-padding">Voltar</a>
    </nav>
    <div class="w3-main" style="margin-left:300px">
    <h1 style="text-align: center;">Reservar e Encomendar</h1>
    <div style="border: solid 3px black; padding: 20px;">
    <form method="get" id="reserva" onsubmit="return reservar()">
        
        <div class="form-section">
            <h3>Selecione as T-Shirts</h3>
            
            <div class="product-item">
                <div class="product-header">
                    <span class="product-name"><img src="images/ex33gustave.webp" width="25%">
                    <span class="product-price">39.99€</span>
                    </span>
                </div>
                <div class="size-selection">
                    <label><input type="checkbox" name="gustave_s" value="S"> S</label>
                    <label><input type="checkbox" name="gustave_m" value="M"> M</label>
                    <label><input type="checkbox" name="gustave_l" value="L"> L</label>
                    <label><input type="checkbox" name="gustave_xl" value="XL"> XL</label>
                </div>
                <div class="quantity-control">
                    <label>Quantidade:</label>
                    <input type="number" name="gustave_qty" min="0" max="99" value="0" onchange="calcularTotal()">
                </div>
            </div>

            <div class="product-item">
                <div class="product-header">
                    <span class="product-name"><img src="images/ex33lune.webp" width="25%">
                    <span class="product-price">19.99€</span>
                    </span>
                </div>
                <div class="size-selection">
                    <label><input type="checkbox" name="lune_s" value="S"> S</label>
                    <label><input type="checkbox" name="lune_m" value="M"> M</label>
                    <label><input type="checkbox" name="lune_l" value="L"> L</label>
                    <label><input type="checkbox" name="lune_xl" value="XL"> XL</label>
                </div>
                <div class="quantity-control">
                    <label>Quantidade:</label>
                    <input type="number" name="lune_qty" min="0" max="99" value="0" onchange="calcularTotal()">
                </div>
            </div>

            <div class="product-item">
                <div class="product-header">
                    <span class="product-name"><img src="images/ex33maelle.webp" width="25%">
                    <span class="product-price">49.99€</span>
                    </span>
                </div>
                <div class="size-selection">
                    <label><input type="checkbox" name="maelle_s" value="S"> S</label>
                    <label><input type="checkbox" name="maelle_m" value="M"> M</label>
                    <label><input type="checkbox" name="maelle_l" value="L"> L</label>
                    <label><input type="checkbox" name="maelle_xl" value="XL"> XL</label>
                </div>
                <div class="quantity-control">
                    <label>Quantidade:</label>
                    <input type="number" name="maelle_qty" min="0" max="99" value="0" onchange="calcularTotal()">
                </div>
            </div>

            <div class="product-item">
                <div class="product-header">
                    <span class="product-name"><img src="images/ex33sciel.webp" width="25%">
                    <span class="product-price">29.99€</span>
                    </span>
                </div>
                <div class="size-selection">
                    <label><input type="checkbox" name="sciel_s" value="S"> S</label>
                    <label><input type="checkbox" name="sciel_m" value="M"> M</label>
                    <label><input type="checkbox" name="sciel_l" value="L"> L</label>
                    <label><input type="checkbox" name="sciel_xl" value="XL"> XL</label>
                </div>
                <div class="quantity-control">
                    <label>Quantidade:</label>
                    <input type="number" name="sciel_qty" min="0" max="99" value="0" onchange="calcularTotal()">
                </div>
            </div>
        </div>

        <div class="total-section">
            <h3>Total: <span id="totalPrice">0.00€</span></h3>
        </div>

        <div class="form-section">
            <h3>Dados de Contacto</h3>
            
            <div class="form-group">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone *</label>
                <input type="tel" id="telefone" name="telefone" required>
            </div>

            <div class="form-group">
                <label for="morada">Morada de Entrega *</label>
                <textarea id="morada" name="morada" required></textarea>
            </div>

            <div class="form-group">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" name="observacoes"></textarea>
            </div>
        </div>

        <button type="submit" class="submit-btn">Confirmar Reserva</button>
        
    </form>
    </div>
    </div>
</body>
<script>
    const precos = { // Preço da roupa
        gustave: 39.99,
        lune: 19.99,
        maelle: 49.99,
        sciel: 29.99
    };

    function calcularTotal() { // Calculo do preço total
        let total = 0;
        
        const gustaveQty = parseInt(document.querySelector('input[name="gustave_qty"]').value) || 0;
        const luneQty = parseInt(document.querySelector('input[name="lune_qty"]').value) || 0;
        const maelleQty = parseInt(document.querySelector('input[name="maelle_qty"]').value) || 0;
        const scielQty = parseInt(document.querySelector('input[name="sciel_qty"]').value) || 0;
        
        total += gustaveQty * precos.gustave;
        total += luneQty * precos.lune;
        total += maelleQty * precos.maelle;
        total += scielQty * precos.sciel;
        
        document.getElementById('totalPrice').textContent = total.toFixed(2) + '€';
    }

    function reservar() { // Verificação do formulário (Ao menos uma peça de roupa selecionada)
        const gustaveQty = parseInt(document.querySelector('input[name="gustave_qty"]').value) || 0;
        const luneQty = parseInt(document.querySelector('input[name="lune_qty"]').value) || 0;
        const maelleQty = parseInt(document.querySelector('input[name="maelle_qty"]').value) || 0;
        const scielQty = parseInt(document.querySelector('input[name="sciel_qty"]').value) || 0;
        
        const totalItems = gustaveQty + luneQty + maelleQty + scielQty;
        
        if (totalItems === 0) {
            alert('Por favor, selecione pelo menos uma T-Shirt!');
            return false;
        }
        
        let resumo = 'Resumo da Reserva:\n\n'; // Recibo que aparece quando faz a reserva
        
        if (gustaveQty > 0) {
            const tamanhos = [];
            if (document.querySelector('input[name="gustave_s"]').checked) tamanhos.push('S');
            if (document.querySelector('input[name="gustave_m"]').checked) tamanhos.push('M');
            if (document.querySelector('input[name="gustave_l"]').checked) tamanhos.push('L');
            if (document.querySelector('input[name="gustave_xl"]').checked) tamanhos.push('XL');
            resumo += `Gustave (${gustaveQty}x) - Tamanhos: ${tamanhos.join(', ')} - ${(gustaveQty * precos.gustave).toFixed(2)}€\n`;
        }
        
        if (luneQty > 0) {
            const tamanhos = [];
            if (document.querySelector('input[name="lune_s"]').checked) tamanhos.push('S');
            if (document.querySelector('input[name="lune_m"]').checked) tamanhos.push('M');
            if (document.querySelector('input[name="lune_l"]').checked) tamanhos.push('L');
            if (document.querySelector('input[name="lune_xl"]').checked) tamanhos.push('XL');
            resumo += `Lune (${luneQty}x) - Tamanhos: ${tamanhos.join(', ')} - ${(luneQty * precos.lune).toFixed(2)}€\n`;
        }
        
        if (maelleQty > 0) {
            const tamanhos = [];
            if (document.querySelector('input[name="maelle_s"]').checked) tamanhos.push('S');
            if (document.querySelector('input[name="maelle_m"]').checked) tamanhos.push('M');
            if (document.querySelector('input[name="maelle_l"]').checked) tamanhos.push('L');
            if (document.querySelector('input[name="maelle_xl"]').checked) tamanhos.push('XL');
            resumo += `Maelle (${maelleQty}x) - Tamanhos: ${tamanhos.join(', ')} - ${(maelleQty * precos.maelle).toFixed(2)}€\n`;
        }
        
        if (scielQty > 0) {
            const tamanhos = [];
            if (document.querySelector('input[name="sciel_s"]').checked) tamanhos.push('S');
            if (document.querySelector('input[name="sciel_m"]').checked) tamanhos.push('M');
            if (document.querySelector('input[name="sciel_l"]').checked) tamanhos.push('L');
            if (document.querySelector('input[name="sciel_xl"]').checked) tamanhos.push('XL');
            resumo += `Sciel (${scielQty}x) - Tamanhos: ${tamanhos.join(', ')} - ${(scielQty * precos.sciel).toFixed(2)}€\n`;
        }
        
        const total = document.getElementById('totalPrice').textContent;
        resumo += `\nTotal: ${total}\n\n`;
        resumo += `Nome: ${document.getElementById('nome').value}\n`;
        resumo += `Email: ${document.getElementById('email').value}\n`;
        resumo += `Telefone: ${document.getElementById('telefone').value}`;
        
        alert(resumo + '\n\nReserva confirmada! Entraremos em contacto em breve.');
        return true;
    }
</script>
</html>
